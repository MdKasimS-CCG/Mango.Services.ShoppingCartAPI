name: Shopping Cart API CI/CD

on:
  push:
    branches:
      - 'feature/*'
      - main

  pull_request:
    branches:
      - main
    types: 
     - opened
     - synchronize
     - reopened

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          
      # Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-mango-shoppingcartapi-${{ hashFiles('Mango.Services.ShoppingCartAPI.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-mango-shoppingcartapi-

      # Create isolated NuGet configuration
      - name: Configure GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name mango-github \
            "https://nuget.pkg.github.com/MdKasimS-CCG/index.json"

      # Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore Mango.Services.ShoppingCartAPI.csproj

      # Build application
      - name: Build
        run: |
          dotnet build Mango.Services.ShoppingCartAPI.csproj \
            --configuration Release \
            --no-restore

      # No automated tests currently exist
      - name: Test
        run: |
          echo "No test project exists for Mango.Services.ShoppingCartAPI."
          echo "Skipping automated tests."

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Build Docker image
      - name: Build Docker image
        run: |
          docker buildx build \
            --secret id=nugetconfig,src="$HOME/.nuget/NuGet/NuGet.Config" \
            --file Dockerfile \
            --tag ghcr.io/mdkasims-ccg/mango-services-shoppingcartapi:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }} \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      # Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push Docker image to GHCR
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
        run: |
          docker push \
            ghcr.io/mdkasims-ccg/mango-services-shoppingcartapi:${{ github.sha }}
